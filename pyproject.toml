[project]
name = "pen-test-reporter"
version = "0.1.0"
description = "Turns raw scanner output (nuclei, nmap, burp) into a polished pen-test report PDF: exec summary, per-finding tech detail with proof-of-vuln, remediation guidance, severity-deduplication."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "b2b-agent-toolkit @ git+https://github.com/anthonyonazure/b2b-agent-toolkit@main",
    "langgraph>=0.2.40",
    "anthropic>=0.39",
    "weasyprint>=62.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.3", "types-defusedxml>=0.7"]

[project.scripts]
pentest = "pentest.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pentest"]

[tool.uv.sources]
b2b-agent-toolkit = { path = "../b2b-agent-toolkit", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
# WeasyPrint publishes no py.typed marker and there is no stub package on
# PyPI, so a hand-written stub for the sliver of API this project touches
# lives in ./stubs. This adds type information; it does not relax any check.
mypy_path = "stubs"
